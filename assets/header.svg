<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270">
<style>
  @keyframes drift { to { transform: translateX(var(--p)); } }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
  @keyframes fly { from { transform: translateX(-40px); } to { transform: translateX(940px); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.4); } }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  @keyframes glow { from { opacity: .35; } to { opacity: .6; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .flap { animation: flap .45s ease-in-out infinite alternate; }
  .tail { transform-origin: -15px 0; animation: wag .35s ease-in-out infinite alternate; }
  .title { animation: rise 1.2s ease-out both; }
  .sub { animation: rise 1.2s ease-out .5s both; }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020c1b"/><stop offset=".7" stop-color="#0b3a66"/><stop offset="1" stop-color="#1b6aa8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b3a66"/><stop offset="1" stop-color="#03152b"/>
  </linearGradient>
  <radialGradient id="moonglow"><stop offset="0" stop-color="#cfe9ff" stop-opacity=".55"/><stop offset="1" stop-color="#cfe9ff" stop-opacity="0"/></radialGradient>
  <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="900" height="270" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="900" height="270" fill="url(#sky)"/>
